services:
  opencode-serve:
    build:
      context: .
      dockerfile: serve.dockerfile
    ports:
      - "4096:4096"
    environment:
      - OPENCODE_SERVER_PASSWORD=changeme
    volumes:
      - opencode-data:/root/.local/share/opencode
      - opencode-config:/root/.config/opencode

  opencode-web:
    build:
      context: .
      dockerfile: web.dockerfile
    ports:
      - "4098:4098"
    environment:
      - OPENCODE_SERVER_PASSWORD=changeme
    volumes:
      - opencode-data:/root/.local/share/opencode
      - opencode-config:/root/.config/opencode

  opencode-acp:
    build:
      context: .
      dockerfile: acp.dockerfile
    ports:
      - "4097:4097"

  opencode-issue-processor:
    build:
      context: .
      dockerfile: issue-processor.dockerfile
    environment:
      - GH_TOKEN
    volumes:
      - opencode-data:/root/.local/share/opencode
      - opencode-config:/root/.config/opencode
    profiles:
      - manual

  opencode-plan-issue:
    build:
      context: .
      dockerfile: plan-issue.dockerfile
    environment:
      - GH_TOKEN
      - ISSUE_URL
    volumes:
      - opencode-data:/root/.local/share/opencode
      - opencode-config:/root/.config/opencode
    profiles:
      - manual

  opencode-generic-worker:
    build:
      context: .
      dockerfile: generic-worker.dockerfile
    environment:
      - REPO_URL
      - ISSUE
      - GH_TOKEN
    volumes:
      - opencode-data:/root/.local/share/opencode
      - opencode-config:/root/.config/opencode
    profiles:
      - manual

volumes:
  opencode-data:
  opencode-config:
